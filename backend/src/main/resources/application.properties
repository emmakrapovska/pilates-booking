spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/pilates}
spring.datasource.username=${DB_USER:pilates}
spring.datasource.password=${DB_PASSWORD:pilates}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.timezone=${APP_TIMEZONE:Europe/Skopje}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5174}

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
